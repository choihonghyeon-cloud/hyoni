<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2026학년도 1학기 시간표 신청</title>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #222;
      text-align: center;
    }
    header {
      background-color: #153e1a;
      color: white;
      padding: 16px;
      font-size: 1.8em;
      font-weight: bold;
    }
    button {
      background-color: #3e7c40;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1em;
      border-radius: 6px;
      margin: 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #264d27;
      transition: 0.2s;
    }
    button:hover {
      background-color: #153e1a;
      transform: translateY(-2px);
    }
    .note {
      font-size: 0.9em;
      color: #444;
      margin-top: 8px;
    }
    .logo img {
      width: 160px;
      margin-top: 25px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border-radius: 12px;
      width: 330px;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .close {
      float: right;
      font-size: 22px;
      cursor: pointer;
    }
    select, input[type="button"] {
      margin-top: 8px;
      padding: 6px;
      width: 100%;
    }
  </style>
</head>

<body>

<header>2026학년도 1학기 시간표 신청</header>

<p>본 프로그램은 2026학년도 1학기 시간표 작성을 위해 참여학교별로 운영됩니다.</p>
<p>각 학교의 개설 과목을 확인하고, 신청 후 내용을 점검할 수 있습니다.</p>

<button onclick="showSubjects()">학교별 개설 과목</button>
<button onclick="openModal1()">1차 기초자료 조사</button>
<button onclick="openModal2()">2차 의견취합</button>

<div class="note">※ 문의 ☎ 055)230-8332 | 경남온라인학교 최홍현</div>

<div class="logo">
  <img src="logo.png" alt="경남온라인학교 로고">
</div>

<!-- 1차 모달 -->
<div id="modal1" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">&times;</span>
    <h3>학교 선택 - 1차 기초자료 조사</h3>

    <select id="school1"></select>
    <input type="button" value="이동" onclick="goFirst()">
  </div>
</div>

<!-- 2차 모달 -->
<div id="modal2" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">&times;</span>
    <h3>학교 선택 - 2차 의견취합</h3>

    <p style="font-size:0.85em;color:#555;">
      ※ 2차 의견취합은 <b>편집 가능</b>합니다.<br>
      최종 편성에 반영되므로 신중히 입력해 주세요.
    </p>

    <select id="school2"></select>
    <input type="button" value="이동" onclick="goSecond()">
  </div>
</div>

<script>
/* ===============================
   학교 목록 (여기만 관리!!)
   =============================== */
const schools = [
  {
    name: "거창여고",
    code: "GCYG",
    first: "1차_거창여고_URL",
    second: "https://docs.google.com/spreadsheets/d/1vizrxh3ddOUQKRFXUJdMAxbBw1uvZ7_mrtH_1t9dJAc/edit?usp=sharing"
  },
  {
    name: "금남고",
    code: "GNG",
    first: "1차_금남고_URL",
    second: "https://docs.google.com/spreadsheets/d/1vizrxh3ddOUQKRFXUJdMAxbBw1uvZ7_mrtH_1t9dJAc/edit?usp=sharing"
  },
  {
    name: "남지고",
    code: "NJG",
    first: "1차_남지고_URL",
    second: "https://docs.google.com/spreadsheets/d/1vizrxh3ddOUQKRFXUJdMAxbBw1uvZ7_mrtH_1t9dJAc/edit?usp=sharing"
  }
];

/* ===============================
   초기 로딩 시 옵션 자동 생성
   =============================== */
window.onload = () => {
  const s1 = document.getElementById("school1");
  const s2 = document.getElementById("school2");

  s1.innerHTML = `<option value="">-- 학교 선택 --</option>`;
  s2.innerHTML = `<option value="">-- 학교 선택 --</option>`;

  schools.forEach(s => {
    const label = `${s.name} (2026-${s.code})`;

    s1.innerHTML += `<option value="${s.first}">${label}</option>`;
    s2.innerHTML += `<option value="${s.second}">${label}</option>`;
  });
};

/* ===============================
   버튼 / 모달 제어
   =============================== */
function showSubjects() {
  window.open(
    "https://docs.google.com/spreadsheets/d/1fxZMocBaHHjE82hRnsV9-RzGO3o7QDrkBt2cGYXWSHo/edit#gid=400361732",
    "_blank"
  );
}

function openModal1() {
  document.getElementById("modal1").style.display = "block";
}
function openModal2() {
  document.getElementById("modal2").style.display = "block";
}
function closeAll() {
  document.getElementById("modal1").style.display = "none";
  document.getElementById("modal2").style.display = "none";
}

function goFirst() {
  const link = document.getElementById("school1").value;
  if (link) window.open(link, "_blank");
  else alert("학교를 선택하세요!");
}

function goSecond() {
  const link = document.getElementById("school2").value;
  if (link) window.open(link, "_blank");
  else alert("학교를 선택하세요!");
}

window.onclick = e => {
  if (e.target.className === "modal") closeAll();
};
</script>

</body>
</html>
