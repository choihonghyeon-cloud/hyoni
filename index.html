    }

    }

      margin:0 auto;

    }

    .btns{ margin-top:18px; }
    button{

      color:#fff;
      border:none;
      padding:12px 28px;
      font-size:1em;
      border-radius:12px;
      margin:10px 8px;
      cursor:pointer;
      box-shadow:3px 3px 0 #264d27;
      transition:.2s;
    }
    button:hover{

      transform:translateY(-2px);
    }
    .note{

      font-size:.95em;
      color:#444;
    }
    .logo img{

      height:auto;
      margin-top:26px;
    }

    /* Modal */
    .modal{
      display:none;          /* ✅ 기본은 닫힘 */
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:1000;
    }
    .modal-content{
      background:#fff;
      width:380px;
      margin:10% auto;
      padding:18px 18px 16px;
      border-radius:14px;
      text-align:left;
      box-shadow:0 6px 24px rgba(0,0,0,.30);
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }
    .modal-title{
      margin:0;
      font-size:18px;
      font-weight:900;
    }
    .close{
      font-size:22px;
      cursor:pointer;
      user-select:none;
    }
    .sub{
      margin:6px 0 10px;
      font-size:12px;
      color:#666;
    }
    select, input[type="button"]{
      width:100%;
      box-sizing:border-box;
      margin-top:10px;
      padding:10px 10px;
      border-radius:10px;
      border:1px solid #d6d6d6;
      font-size:14px;
    }
    input[type="button"]{
      background:#f2f2f2;
      font-weight:800;
      cursor:pointer;
    }
    input[type="button"]:hover{ background:#e9e9e9; }

    /* =========================
       3) 모달 로직 (1차/2차 분기)
       ========================= */
    let currentLinks = {};
    let currentPhase = "phase1";

    function openModal(phase) {
      currentPhase = phase;
      currentLinks = (phase === "phase2") ? phase2Links : phase1Links;

      const select = document.getElementById("schoolSelect");
      select.innerHTML = '<option value="">-- 학교를 선택하세요 --</option>';

      Object.keys(currentLinks).forEach(name => {
        const opt = document.createElement("option");
        opt.value = currentLinks[name];
        opt.textContent = name;
        select.appendChild(opt);
      });

      document.getElementById("modalTitle").textContent =
        (phase === "phase2") ? "2차 시간표(안) - 학교 선택" : "1차 기초자료 조사 - 학교 선택";

      document.getElementById("modalSub").textContent =
        (phase === "phase2")
          ? "2차 시간표(안) 입력용 시트입니다. 학교를 선택하세요."
          : "1차 기초자료 조사 입력용 시트입니다. 학교를 선택하세요.";

      const modal = document.getElementById("schoolModal");
      modal.style.display = "block";
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      const modal = document.getElementById("schoolModal");
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
    }

    function moveToSelected() {
      const link = document.getElementById("schoolSelect").value;
      if (!link) return alert("학교를 선택하세요!");
      window.open(link, "_blank");
      closeModal();
    }

    // 모달 바깥 클릭 닫기
    window.addEventListener("click", function(e) {
      const modal = document.getElementById("schoolModal");
      if (e.target === modal) closeModal();
    });

    // ESC 닫기
    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeModal();
    });

    // 혹시 이전 캐시/오작동 방지: 로드시 무조건 닫기
    window.addEventListener("load", function() {
      closeModal();
    });
  </script>
</body>
</html>
